nd">bigint</text><text x="842" y="580" font-size="14" fill="#1f2937" font-weight="400" text-anchor="start">action</text><text x="1070" y="580" font-size="12" fill="#6b7280" font-weight="400" text-anchor="end">string</text></g><path d="M340 260 H470" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-dasharray="7 5"/><path d="M348 252 V268 M354 252 V268" stroke="#2563eb" stroke-width="1.8"/><path d="M470 251 L456 260 L470 269 M470 260 H456" fill="none" stroke="#2563eb" stroke-width="1.8"/><text x="405" y="248" font-size="12" fill="#2563eb" font-weight="400" text-anchor="middle">cross-DB</text><text x="405" y="280" font-size="12" fill="#2563eb" font-weight="400" text-anchor="middle">inferred</text><path d="M605 340 V500" stroke="#d97706" stroke-width="3" stroke-dasharray="10 6" fill="none"/><path d="M597 348 H613 M597 354 H613" stroke="#d97706" stroke-width="1.8"/><path d="M596 500 L605 486 L614 500 M605 500 V486" fill="none" stroke="#d97706" stroke-width="1.8"/><path d="M740 260 H830" fill="none" stroke="#d97706" stroke-width="3"/><path d="M748 252 V268 M754 252 V268" stroke="#d97706" stroke-width="1.8"/><path d="M830 251 L816 260 L830 269 M830 260 H816" fill="none" stroke="#d97706" stroke-width="1.8"/><rect x="110" y="520" width="220" height="110" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4"/><text x="220" y="552" font-size="17" fill="#7c3aed" font-weight="700" text-anchor="middle">«commentable»</text><text x="220" y="578" font-size="13" fill="#6b7280" font-weight="400" text-anchor="middle">polymorphic: comments</text><text x="220" y="602" font-size="13" fill="#6b7280" font-weight="400" text-anchor="middle">orders, products +38 more</text><path d="M220 520 V310 H470" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4"/><path d="M211 520 L220 506 L229 520 M220 520 V506" fill="none" stroke="#7c3aed" stroke-width="1.8"/><text x="130" y="700" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" font-style="italic">audit_logs dimmed: not linked to the selected table</text><circle cx="745" cy="160" r="13" fill="#2563eb"/><text x="745" y="165" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">1</text><circle cx="405" cy="212" r="13" fill="#2563eb"/><text x="405" y="217" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">2</text><circle cx="630" cy="420" r="13" fill="#2563eb"/><text x="630" y="425" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">3</text><circle cx="110" cy="520" r="13" fill="#2563eb"/><text x="110" y="525" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">4</text><circle cx="762" cy="317" r="13" fill="#2563eb"/><text x="762" y="322" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">5</text><circle cx="1100" cy="108" r="13" fill="#2563eb"/><text x="1100" y="113" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">6</text><rect x="1150" y="80" width="410" height="790" rx="12" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/><circle cx="1184" cy="130" r="13" fill="#2563eb"/><text x="1184" y="135" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="1210" y="136" font-size="18" fill="#1f2937" font-weight="700" text-anchor="start">Click a table</text><text x="1210" y="164" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start">it and every line into it light up,</text><text x="1210" y="186" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start">the rest fades</text><circle cx="1184" cy="250" r="13" fill="#2563eb"/><text x="1184" y="255" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="1210" y="256" font-size="18" fill="#1f2937" font-weight="700" text-anchor="start">Cross-DB / inferred link</text><text x="1210" y="284" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start">dashed + evidence (file:line),</text><text x="1210" y="306" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start">stays dashed until reviewed</text><circle cx="1184" cy="370" r="13" fill="#2563eb"/><text x="1184" y="375" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="1210" y="376" font-size="18" fill="#1f2937" font-weight="700" text-anchor="start">Click a line</text><text x="1210" y="404" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start">animated flow shows</text><text x="1210" y="426" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start">where the relation goes</text><circle cx="1184" cy="490" r="13" fill="#2563eb"/><text x="1184" y="495" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="1210" y="496" font-size="18" fill="#1f2937" font-weight="700" text-anchor="start">Polymorphic as one node</text><text x="1210" y="524" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start">40 targets in 1 box,</text><text x="1210" y="546" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start">lines appear only on click</text><circle cx="1184" cy="610" r="13" fill="#2563eb"/><text x="1184" y="615" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">5</text><text x="1210" y="616" font-size="18" fill="#1f2937" font-weight="700" text-anchor="start">Hub columns as badges</text><text x="1210" y="644" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start">created_by → users shown in the box,</text><text x="1210" y="666" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start">not 100 lines into one table</text><circle cx="1184" cy="730" r="13" fill="#2563eb"/><text x="1184" y="735" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">6</text><text x="1210" y="736" font-size="18" fill="#1f2937" font-weight="700" text-anchor="start">Search + two modes</text><text x="1210" y="764" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start">Business hides types,</text><text x=