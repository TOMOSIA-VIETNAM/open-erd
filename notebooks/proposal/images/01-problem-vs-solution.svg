 foreign keys → DB tools draw no relations</text><text x="70" y="770" font-size="19" fill="#1f2937" font-weight="400" text-anchor="start">✕  Polymorphic &amp; cross-DB links are invisible</text><text x="70" y="810" font-size="19" fill="#1f2937" font-weight="400" text-anchor="start">✕  100+ tables drawn flat = unreadable spaghetti</text><rect x="860" y="170" width="300" height="150" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/><text x="874" y="196" font-size="15" fill="#6b7280" font-weight="700" text-anchor="start">auth</text><text x="1146" y="196" font-size="13" fill="#6b7280" font-weight="400" text-anchor="end">MySQL</text><rect x="925" y="220" width="170" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="1010" y="252" font-size="18" fill="#1f2937" font-weight="700" text-anchor="middle">Identity</text><text x="1010" y="274" font-size="13" fill="#6b7280" font-weight="400" text-anchor="middle">12 tables</text><rect x="1220" y="170" width="300" height="150" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/><text x="1234" y="196" font-size="15" fill="#6b7280" font-weight="700" text-anchor="start">catalog</text><text x="1506" y="196" font-size="13" fill="#6b7280" font-weight="400" text-anchor="end">MongoDB</text><rect x="1285" y="220" width="170" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="1370" y="252" font-size="18" fill="#1f2937" font-weight="700" text-anchor="middle">Catalog</text><text x="1370" y="274" font-size="13" fill="#6b7280" font-weight="400" text-anchor="middle">18 tables</text><rect x="860" y="380" width="660" height="230" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/><text x="874" y="406" font-size="15" fill="#6b7280" font-weight="700" text-anchor="start">billing</text><text x="1506" y="406" font-size="13" fill="#6b7280" font-weight="400" text-anchor="end">PostgreSQL</text><rect x="925" y="450" width="170" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="1010" y="482" font-size="18" fill="#1f2937" font-weight="700" text-anchor="middle">Orders</text><text x="1010" y="504" font-size="13" fill="#6b7280" font-weight="400" text-anchor="middle">24 tables</text><rect x="1285" y="450" width="170" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="1370" y="482" font-size="18" fill="#1f2937" font-weight="700" text-anchor="middle">Billing</text><text x="1370" y="504" font-size="13" fill="#6b7280" font-weight="400" text-anchor="middle">31 tables</text><path d="M1095 485 H1285" fill="none" stroke="#1f2937" stroke-width="1.8"/><text x="1190" y="475" font-size="13" fill="#6b7280" font-weight="400" text-anchor="middle">14 links</text><path d="M1010 290 V450" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="7 5"/><text x="1020" y="375" font-size="13" fill="#2563eb" font-weight="400" text-anchor="start">cross-DB</text><path d="M1370 290 V450" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="7 5"/><text x="1380" y="375" font-size="13" fill="#2563eb" font-weight="400" text-anchor="start">cross-DB</text><text x="1190" y="640" font-size="14" fill="#6b7280" font-weight="400" text-anchor="middle" font-style="italic">click a domain → its tables → one table + neighbours</text><text x="850" y="690" font-size="19" fill="#1f2937" font-weight="400" text-anchor="start">✓  Generated from source code, re-synced in minutes</text><text x="850" y="730" font-size="19" fill="#1f2937" font-weight="400" text-anchor="start">✓  Same input → same diagram, every time</text><text x="850" y="770" font-size="19" fill="#1f2937" font-weight="400" text-anchor="start">✓  One SVG file: click, search, animate — no install</text><text x="850" y="810" font-size="19" fill="#1f2937" font-weight="400" text-anchor="start">✓  Excel data dictionary + readable change report</text></svg>