<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs>
<rect width="1600" height="880" fill="#fff"/><text x="800" y="56" font-size="28" fill="#1f2937" font-weight="700" text-anchor="middle">How open-erd works — AI writes the model, code draws the diagram</text><rect x="40" y="100" width="700" height="560" rx="14" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/><text x="60" y="132" font-size="18" fill="#7c3aed" font-weight="700" text-anchor="start">AI zone (Claude)</text><rect x="780" y="100" width="780" height="560" rx="14" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/><text x="800" y="132" font-size="18" fill="#6b7280" font-weight="700" text-anchor="start">Deterministic zone (plain code, no LLM)</text><rect x="70" y="170" width="260" height="150" rx="10" fill="#fff" stroke="#1f2937" stroke-width="1.5"/><text x="88" y="202" font-size="19" fill="#1f2937" font-weight="700" text-anchor="start">Source code</text><text x="88" y="232" font-size="15" fill="#6b7280" font-weight="400" text-anchor="start">Rails · Laravel · Django</text><text x="88" y="258" font-size="15" fill="#6b7280" font-weight="400" text-anchor="start">Node · Prisma · Mongoose …</text><text x="88" y="284" font-size="15" fill="#6b7280" font-weight="400" text-anchor="start">one or many repos</text><rect x="70" y="360" width="260" height="150" rx="10" fill="#fff" stroke="#1f2937" stroke-width="1.5"/><text x="88" y="392" font-size="19" fill="#1f2937" font-weight="700" text-anchor="start">Databases</text><text x="88" y="422" font-size="15" fill="#6b7280" font-weight="400" text-anchor="start">MySQL · Postgres · Mongo …</text><text x="88" y="448" font-size="15" fill="#6b7280" font-weight="400" text-anchor="start">metadata only</text><text x="88" y="474" font-size="15" fill="#6b7280" font-weight="400" text-anchor="start">read only with permission</text><rect x="400" y="210" width="300" height="260" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><text x="418" y="242" font-size="19" fill="#7c3aed" font-weight="700" text-anchor="start">Claude</text><text x="418" y="272" font-size="15" fill="#6b7280" font-weight="400" text-anchor="start">writes extract script</text><text x="418" y="298" font-size="15" fill="#6b7280" font-weight="400" text-anchor="start">   per project (re-runnable)</text><text x="418" y="324" font-size="15" fill="#6b7280" font-weight="400" text-anchor="start">groups tables into domains</text><text x="418" y="350" font-size="15" fill="#6b7280" font-weight="400" text-anchor="start">notes + enum meanings</text><text x="418" y="376" font-size="15" fill="#6b7280" font-weight="400" text-anchor="start">infers hidden relations</text><text x="418" y="402" font-size="15" fill="#6b7280" font-weight="400" text-anchor="start">   with evidence (file:line)</text><path d="M330 245 H400" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arr)"/><path d="M330 435 H400" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arr)"/><rect x="810" y="210" width="300" height="260" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2.5"/><text x="828" y="242" font-size="19" fill="#2563eb" font-weight="700" text-anchor="start">Model</text><text x="828" y="272" font-size="15" fill="#6b7280" font-weight="400" text-anchor="start">model/&lt;db&gt;.yaml</text><text x="828" y="298" font-size="15" fill="#6b7280" font-weight="400" text-anchor="start">layout.json (pinned positions)</text><text x="828" y="324" font-size="15" fill="#6b7280" font-weight="400" text-anchor="start"></text><text x="828" y="350" font-size="15" fill="#6b7280" font-weight="400" text-anchor="start">single source of truth</text><text x="828" y="376" font-size="15" fill="#6b7280" font-weight="400" text-anchor="start">git-versioned, human-reviewed</text><text x="828" y="402" font-size="15" fill="#6b7280" font-weight="400" text-anchor="start">tags = snapshots for diff</text><path d="M700 340 H810" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrB)"/><rect x="1170" y="150" width="360" height="120" rx="10" fill="#fff" stroke="#1f2937" stroke-width="1.5"/><text x="1188" y="182" font-size="19" fill="#1f2937" font-weight="700" text-anchor="start">Engine</text><text x="1188" y="212" font-size="15" fill="#6b7280" font-weight="400" text-anchor="start">layout (ELK) · render · semantic diff</text><text x="1188" y="238" font-size="15" fill="#6b7280" font-weight="400" text-anchor="start">same input → byte-identical output</text><path d="M1110 300 C1140 300 1140 210 1170 210" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arr)"/><rect x="1230" y="310" width="300" height="66" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="1248" y="338" font-size="18" fill="#16a34a" font-weight="700" text-anchor="start">erd.svg</text><text x="1248" y="362" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start">interactive, single file</text><rect x="1230" y="392" width="300" height="66" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="1248" y="420" font-size="18" fill="#16a34a" font-weight="700" text-anchor="start">erd.xlsx</text><text x="1248" y="444" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start">overview + dictionary</text><rect x="1230" y="474" width="300" height="66" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="1248" y="502" font-size="18" fill="#16a34a" font-weight="700" text-anchor="start">diff.svg</text><text x="1248" y="526" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start">what changed since v1.0</text><path d="M1200 270 V507" fill="none" stroke="#6b7280" stroke-width="1.8"/><path d="M1200 343 H1230" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arr)"/><path d="M1200 425 H1230" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arr)"/><path d="M1200 507 H1230" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arr)"/><rect x="400" y="720" width="760" height="120" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="420" y="752" font-size="19" fill="#d97706" font-weight="700" text-anchor="start">Edit by talking in the terminal</text><text x="420" y="782" font-size="15" fill="#1f2937" font-weight="400" text-anchor="start" font-style="italic">“orders.status: add meaning for refunded”   “move Billing to the right”</text><text x="420" y="810" font-size="15" fill="#1f2937" font-weight="400" text-anchor="start" font-style="italic">“the link invoices → users is wrong, it goes to customers”</text><path d="M550 720 V470" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><path d="M960 720 V470" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrB)"/><text x="560" y="600" font-size="14" fill="#d97706" font-weight="400" text-anchor="start">AI edits model</text><text x="970" y="600" font-size="14" fill="#d97706" font-weight="400" text-anchor="start">then re-render</text></svg>