schema_version: 1
database: billing
engine: postgresql
tenant_schemas:
  - { schema: tenant, note: "One schema tenant_<slug> per tenants row, chosen through search_path (src/db/tenant-schema.ts)." }
tables:
  - id: billing.public.plans
    domain: Plans
    note: Shared price plans offered to every tenant.
    columns:
      - { name: id, type: serial, pk: true, auto_increment: true }
      - { name: code, type: varchar(40), nullable: false, unique: true }
      - { name: name, type: varchar(120), nullable: false }
      - { name: price_cents, type: integer, nullable: false }
      - name: interval
        type: billing_interval
        nullable: false
        enum:
          monthly: Billed every month (BillingInterval.Monthly)
          yearly: Billed every year (BillingInterval.Yearly)
  - id: billing.public.tenants
    domain: Tenancy
    note: One row per tenant; slug names the tenant's own schema tenant_<slug>.
    columns:
      - { name: id, type: uuid, pk: true, default: gen_random_uuid() }
      - { name: slug, type: varchar(63), nullable: false, unique: true }
      - { name: name, type: varchar(200), nullable: false }
      - name: status
        type: tenants_status_enum
        nullable: false
        default: trial
        enum:
          trial: Tenant is evaluating the product (TenantStatus.Trial)
          active: Paying tenant (TenantStatus.Active)
          suspended: Access blocked (TenantStatus.Suspended)
      - { name: created_at, type: timestamptz, nullable: false, default: now() }
  - id: billing.tenant.customers
    domain: Billing
    note: Customer company billed inside one tenant.
    columns:
      - { name: id, type: uuid, pk: true, default: gen_random_uuid() }
      - { name: email, type: varchar(255), nullable: false, pii: true }
      - { name: company_name, type: varchar(200), nullable: true }
      - { name: tax_id, type: varchar(40), nullable: true, pii: true }
  - id: billing.tenant.subscriptions
    domain: Billing
    note: A customer's subscription to a shared plan.
    columns:
      - { name: id, type: uuid, pk: true, default: gen_random_uuid() }
      - { name: customer_id, type: uuid, nullable: false }
      - { name: plan_id, type: integer, nullable: false }
      - name: state
        type: subscriptions_state_enum
        nullable: false
        default: trialing
        enum:
          trialing: In free trial (SubscriptionState.Trialing)
          active: Paid and current (SubscriptionState.Active)
          past_due: Latest invoice unpaid (SubscriptionState.PastDue)
          canceled: Ended (SubscriptionState.Canceled)
      - { name: current_period_end, type: timestamptz, nullable: false }
  - id: billing.tenant.invoices
    domain: Billing
    note: One-off invoices have no subscription.
    columns:
      - { name: id, type: uuid, pk: true, default: gen_random_uuid() }
      - { name: customer_id, type: uuid, nullable: false }
      - { name: subscription_id, type: uuid, nullable: true }
      - name: status
        type: invoices_status_enum
        nullable: false
        default: draft
        enum:
          draft: Being prepared, not sent (InvoiceStatus.Draft)
          open: Sent, awaiting payment (InvoiceStatus.Open)
          paid: Fully paid (InvoiceStatus.Paid)
          void: Cancelled (InvoiceStatus.Void)
      - { name: total_cents, type: bigint, nullable: false }
      - { name: issued_at, type: timestamptz, nullable: true }
  - id: billing.tenant.invoice_lines
    domain: Billing
    note: product_id is a catalog-service product id.
    columns:
      - { name: id, type: uuid, pk: true, default: gen_random_uuid() }
      - { name: invoice_id, type: uuid, nullable: false }
      - { name: product_id, type: bigint, nullable: true }
      - { name: description, type: varchar(255), nullable: false }
      - { name: quantity, type: integer, nullable: false }
      - { name: unit_price_cents, type: integer, nullable: false }
  - id: billing.tenant.payments
    domain: Billing
    note: Payment received for an invoice.
    columns:
      - { name: id, type: uuid, pk: true, default: gen_random_uuid() }
      - { name: invoice_id, type: uuid, nullable: false }
      - name: method
        type: payments_method_enum
        nullable: false
        enum:
          card: Card charge (PaymentMethod.Card)
          bank_transfer: Bank transfer (PaymentMethod.BankTransfer)
          credit: Account credit applied (PaymentMethod.Credit)
      - { name: amount_cents, type: bigint, nullable: false }
      - { name: gateway_ref, type: varchar(80), nullable: true }
      - { name: created_at, type: timestamptz, nullable: false, default: now() }
  - id: billing.tenant.usage_events
    domain: Metering
    note: Metered usage of a subscription; monthly partitions usage_events_YYYY_MM are merged into this table.
    partition: { method: range, columns: [occurred_at], interval: month }
    columns:
      - { name: id, type: bigint, pk: true }
      - { name: occurred_at, type: timestamptz, pk: true }
      - { name: subscription_id, type: uuid, nullable: false }
      - { name: metric, type: varchar(60), nullable: false }
      - { name: quantity, type: integer, nullable: false }
relations:
  - { from: { table: billing.tenant.subscriptions, columns: [customer_id] }, to: { table: billing.tenant.customers, columns: [id] }, cardinality: n-1, optional: false, kind: db_fk, evidence: ["billing-service:src/entities/subscription.entity.ts#Subscription"], review: pending }
  - { from: { table: billing.tenant.subscriptions, columns: [plan_id] }, to: { table: billing.public.plans, columns: [id] }, cardinality: n-1, optional: false, kind: db_fk, evidence: ["billing-service:src/entities/subscription.entity.ts#Subscription"], review: pending }
  - { from: { table: billing.tenant.invoices, columns: [customer_id] }, to: { table: billing.tenant.customers, columns: [id] }, cardinality: n-1, optional: false, kind: db_fk, evidence: ["billing-service:src/entities/invoice.entity.ts#Invoice"], review: pending }
  - { from: { table: billing.tenant.invoices, columns: [subscription_id] }, to: { table: billing.tenant.subscriptions, columns: [id] }, cardinality: n-1, optional: true, kind: db_fk, evidence: ["billing-service:src/entities/invoice.entity.ts#Invoice"], review: pending }
  - { from: { table: billing.tenant.invoice_lines, columns: [invoice_id] }, to: { table: billing.tenant.invoices, columns: [id] }, cardinality: n-1, optional: false, kind: db_fk, evidence: ["billing-service:src/entities/invoice-line.entity.ts#InvoiceLine"], review: pending }
  - { from: { table: billing.tenant.payments, columns: [invoice_id] }, to: { table: billing.tenant.invoices, columns: [id] }, cardinality: n-1, optional: false, kind: db_fk, evidence: ["billing-service:src/entities/payment.entity.ts#Payment"], review: pending }
  - { from: { table: billing.tenant.usage_events, columns: [subscription_id] }, to: { table: billing.tenant.subscriptions, columns: [id] }, cardinality: n-1, optional: false, kind: inferred, evidence: ["billing-service:src/services/usage-service.ts#recordUsage"], review: pending }
