schema_version: 1
database: shop
engine: mysql
domains:
  Catalog:
    note: Products the shop sells, grouped into categories and brands, with their prices.
  Content:
    note: Posts and comments customers and staff write about products and orders.
  Orders:
    note: What a customer bought, how it was paid and what was refunded.
tables:
  - id: shop._.categories
    domain: Catalog
    columns:
      - { name: id, type: bigint, pk: true }
      - { name: parent_id, type: bigint, nullable: true }
      - { name: name, type: varchar(120) }
  - id: shop._.brands
    domain: Catalog
    columns:
      - { name: id, type: bigint, pk: true }
      - { name: name, type: varchar(120) }
  - id: shop._.products
    domain: Catalog
    columns:
      - { name: id, type: bigint, pk: true }
      - { name: category_id, type: bigint, nullable: false }
      - { name: brand_id, type: bigint, nullable: true }
      - { name: title, type: varchar(255) }
      - { name: created_by, type: bigint }
      - { name: updated_by, type: bigint }
  - id: shop._.tags
    domain: Catalog
    columns:
      - { name: id, type: bigint, pk: true }
      - { name: label, type: varchar(40) }
  - id: shop._.product_tags
    domain: Catalog
    columns:
      - { name: product_id, type: bigint, nullable: false }
      - { name: tag_id, type: bigint, nullable: false }
  - id: shop._.orders
    domain: Orders
    note: One order per checkout; the basket becomes order items.
    columns:
      - { name: id, type: bigint, pk: true, auto_increment: true }
      - { name: user_id, type: bigint, nullable: false }
      - { name: organization_id, type: bigint, nullable: true }
      - name: status
        type: varchar(16)
        default: pending
        note: Lifecycle of the order; only paid orders are shipped.
        enum:
          pending: Created, waiting for payment
          paid: Payment confirmed by the gateway
          cancelled: Cancelled by the customer or by timeout
      - { name: placed_at, type: datetime }
    indexes:
      - { name: index_orders_on_user_id_and_status, columns: [user_id, status] }
      - { name: index_orders_on_placed_at, columns: [placed_at], where: "status = 'paid'" }
  - id: shop._.order_items
    domain: Orders
    columns:
      - { name: id, type: bigint, pk: true }
      - { name: order_id, type: bigint, nullable: false }
      - { name: product_id, type: bigint, nullable: false }
      - { name: quantity, type: int }
  - id: shop._.payments
    domain: Orders
    columns:
      - { name: id, type: bigint, pk: true }
      - { name: order_id, type: bigint, nullable: false }
      - { name: amount_cents, type: int }
      - { name: amount, type: "numeric(12,2)", generated: amount_cents / 100.0, note: "Amount in currency units, computed by the database." }
  - id: shop._.refunds
    domain: Orders
    columns:
      - { name: id, type: bigint, pk: true }
      - { name: payment_id, type: bigint, nullable: false }
      - { name: reason, type: text }
  - id: shop._.posts
    domain: Content
    columns:
      - { name: id, type: bigint, pk: true }
      - { name: title, type: varchar(255) }
      - { name: created_by, type: bigint }
  - id: shop._.comments
    domain: Content
    columns:
      - { name: id, type: bigint, pk: true }
      - { name: commentable_type, type: varchar(40) }
      - { name: commentable_id, type: bigint, nullable: false }
      - { name: body, type: text, pii: true, note: Free text written by the customer. }
      - { name: created_by, type: bigint }
  - id: shop._.attachments
    domain: Content
    columns:
      - { name: id, type: bigint, pk: true }
      - { name: attachable_type, type: varchar(40) }
      - { name: attachable_id, type: bigint, nullable: true }
      - { name: url, type: text }
relations:
  - { from: { table: shop._.categories, columns: [parent_id] }, to: { table: shop._.categories, columns: [id] }, cardinality: n-1, optional: true, kind: db_fk, evidence: [db], review: reviewed }
  - { from: { table: shop._.products, columns: [category_id] }, to: { table: shop._.categories, columns: [id] }, cardinality: n-1, optional: false, kind: db_fk, evidence: [db], review: reviewed }
  - { from: { table: shop._.products, columns: [brand_id] }, to: { table: shop._.brands, columns: [id] }, cardinality: n-1, optional: true, kind: declared, evidence: ["shop-api:app/models/product.rb#Product"], review: stale }
  - { from: { table: shop._.product_tags, columns: [product_id] }, to: { table: shop._.products, columns: [id] }, cardinality: n-1, optional: false, kind: db_fk, evidence: [db], review: reviewed }
  - { from: { table: shop._.product_tags, columns: [tag_id] }, to: { table: shop._.tags, columns: [id] }, cardinality: n-1, optional: false, kind: inferred, evidence: ["shop-api:app/models/tag.rb#Tag"], review: pending }
  - { from: { table: shop._.order_items, columns: [order_id] }, to: { table: shop._.orders, columns: [id] }, cardinality: n-1, optional: false, kind: db_fk, evidence: [db], review: reviewed }
  - { from: { table: shop._.order_items, columns: [product_id] }, to: { table: shop._.products, columns: [id] }, cardinality: n-1, optional: false, kind: db_fk, evidence: [db], review: reviewed }
  - { from: { table: shop._.payments, columns: [order_id] }, to: { table: shop._.orders, columns: [id] }, cardinality: n-1, optional: false, kind: inferred, evidence: ["shop-api:app/models/payment.rb#Payment"], review: pending }
  - { from: { table: shop._.refunds, columns: [payment_id] }, to: { table: shop._.payments, columns: [id] }, cardinality: n-1, optional: false, kind: inferred, evidence: ["shop-api:app/models/refund.rb#Refund"], review: reviewed }
polymorphic:
  - name: commentable
    table: shop._.comments
    type_column: commentable_type
    id_column: commentable_id
    optional: false
    targets: [shop._.posts, shop._.products, shop._.orders]
    note: Customers discuss a post, product or order; support staff answer in the same thread.
    internal_note: CommentsController#create sets the type from the route.
    evidence: ["shop-api:app/models/comment.rb#Comment"]
    review: reviewed
  - name: attachable
    table: shop._.attachments
    type_column: attachable_type
    id_column: attachable_id
    optional: true
    targets: [shop._.posts, shop._.comments, shop._.products, shop._.orders, shop._.refunds]
    evidence: ["shop-api:app/models/attachment.rb#Attachment"]
    review: pending
