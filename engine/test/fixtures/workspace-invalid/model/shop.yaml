database: shop
engine: mysql
tables:
  - id: shop.orders
    domain: Sales
    columns:
      - { name: id, type: bigint, pk: true }
  - id: shop._.line.items
    domain: Sales
    columns:
      - { name: id, type: bigint, pk: true }
  - id: shop._.carts
    domain: Sales
    columns:
      - { name: id, type: bigint, pk: true }
      - name: status
        type: tinyint
        enum: [open, closed]
relations:
  - from: { table: shop._.carts, columns: [id] }
    to: { table: shop._.carts, columns: [id] }
    cardinality: many-to-one
    optional: false
    kind: db_fk
    evidence: [db]
    review: maybe
