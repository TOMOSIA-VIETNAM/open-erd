    review: reviewed
  - from: { table: shop.public.reviews, columns: [product_id] }
    to: { table: shop.public.products, columns: [id] }
    cardinality: n-1
    optional: false
    kind: db_fk
    evidence: [db]
    review: reviewed
  - from: { table: shop.public.reviews, columns: [user_id] }
    to: { table: shop.public.users, columns: [id] }
    cardinality: n-1
    optional: false
    kind: db_fk
