    cardinality: n-1
    optional: true
    kind: db_fk
    evidence: [db]
    review: reviewed
  - from: { table: shop.public.order_items, columns: [order_id] }
    to: { table: shop.public.orders, columns: [id] }
    cardinality: n-1
